<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse a clear, searchable GCSE maths resource library organised by goal, level, resource type and exam board." />
  <meta name="theme-color" content="#10251f" />
  <title>Resource Library | Abir's Academy</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="library.css" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body class="dashboard-page">

  <div class="dashboard-container">
    <!-- SIDEBAR -->
    <aside class="dashboard-sidebar">
      <div class="sidebar-brand">
        <a href="index.html" aria-label="Abir's Academy home">
          <span class="brand-mark" aria-hidden="true">A²</span>
          <span class="brand-name">Abir's <strong>Academy</strong></span>
        </a>
      </div>
      
      <nav class="sidebar-nav">
        <p class="sidebar-label">Curriculum</p>
        <button class="nav-item is-active" data-library-filter="all">
          <span class="nav-icon">&#8862;</span> All Grades
        </button>
        <button class="nav-item" data-library-filter="grade-1">
          <span class="nav-icon">1</span> Grade 1
        </button>
        <button class="nav-item" data-library-filter="grade-2">
          <span class="nav-icon">2</span> Grade 2
        </button>
        <button class="nav-item" data-library-filter="grade-3">
          <span class="nav-icon">3</span> Grade 3
        </button>
        <button class="nav-item" data-library-filter="grade-4">
          <span class="nav-icon">4</span> Grade 4
        </button>
        <button class="nav-item" data-library-filter="grade-5">
          <span class="nav-icon">5</span> Grade 5
        </button>
        <button class="nav-item" data-library-filter="grade-6">
          <span class="nav-icon">6</span> Grade 6
        </button>
        <button class="nav-item" data-library-filter="grade-7">
          <span class="nav-icon">7</span> Grade 7
        </button>
        <button class="nav-item" data-library-filter="grade-8">
          <span class="nav-icon">8</span> Grade 8
        </button>
        <button class="nav-item" data-library-filter="grade-9">
          <span class="nav-icon">9</span> Grade 9
        </button>
        
        <p class="sidebar-label" style="margin-top:2rem;">My Resources</p>
        <button class="nav-item" data-saved-filter aria-pressed="false">
          <span class="nav-icon">&#9733;</span> Saved Routes
        </button>
      </nav>
      
      <div class="sidebar-footer">
        <a href="index.html" class="nav-item">
          <span class="nav-icon">&#8592;</span> Back to Home
        </a>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="dashboard-main">
      <!-- TOP BAR -->
      <header class="dashboard-header">
        <div class="search-wrap">
          <span class="search-icon">&#128269;</span>
          <input type="search" placeholder="Search topics..." data-library-search />
        </div>
        <div class="header-right">
          <span class="notification-icon">&#128276;</span>
          
        </div>
      </header>

      <!-- CONTENT AREA -->
      <div class="dashboard-content">
        <div class="content-header">
          <div>
            <h1>Resource Library</h1>
            <p>All mathematics resources for Edexcel / AQA</p>
          </div>
          <button class="button" data-clear-filters hidden>Clear Filters</button>
        </div>

        <div class="quick-stats">
          <button class="stat-pill is-active" data-tier-filter="all">All <span data-total-count></span></button>
          <button class="stat-pill" data-tier-filter="Foundation">Foundation <span>(G1-5)</span></button>
          <button class="stat-pill" data-tier-filter="Higher">Higher <span>(G5-9)</span></button>
        </div>

        <div class="library-grid dashboard-grid" data-library-grid>
          <!-- JS Rendered Cards -->
        </div>

        <div class="empty-state" data-library-empty hidden>
          <p>No resources found for this combination.</p>
          <button class="button button-outline" data-empty-clear>Clear filters</button>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" data-saved-toast aria-live="polite"></div>
  
  <script src="library-v8.js" defer></script>
</body>
</html>
